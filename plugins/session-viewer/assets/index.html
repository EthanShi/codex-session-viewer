<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Session Viewer</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="/icon.svg" alt="" />
          </div>
          <div>
            <h1>Session Viewer</h1>
            <p id="brand-subtitle">Local Codex traces</p>
          </div>
        </header>

        <div class="source-tabs" role="tablist" aria-label="Session source">
          <button class="source-tab active" data-source="codex" type="button" role="tab" aria-selected="true">
            Codex
          </button>
          <button class="source-tab" data-source="claude" type="button" role="tab" aria-selected="false">
            Claude Code
          </button>
        </div>

        <div class="sidebar-tools">
          <div class="range-controls">
            <div class="range-shortcuts" role="group" aria-label="时间段快捷选择">
              <button data-range-days="7" type="button" aria-pressed="true" class="active">最近一周</button>
              <button data-range-days="30" type="button" aria-pressed="false">最近一月（30天）</button>
            </div>
            <div class="range-dates">
              <label>开始日期<input id="range-from" type="date" aria-describedby="range-help range-error" required /></label>
              <label>结束日期<input id="range-to" type="date" aria-describedby="range-help range-error" required /></label>
            </div>
            <p id="range-help" class="range-help">按日志最后写入时间筛选，含首尾日期，最多 30 个自然日。</p>
            <p id="range-applied" class="range-help"></p>
            <p id="range-error" class="range-error hidden" role="alert"></p>
          </div>
          <div class="search-controls">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="session-search" type="search" placeholder="全文搜索…" aria-label="全文搜索 session 日志" autocomplete="off" />
              <kbd>/</kbd>
            </label>
            <button id="search-submit" class="search-submit" type="button">应用时间段</button>
          </div>
          <p id="search-status" class="search-status hidden" role="status" aria-live="polite"></p>
          <progress id="index-progress" class="index-progress hidden" aria-label="全文索引进度" max="1" value="0"></progress>
          <div class="filter-row" role="group" aria-label="Session status">
            <button class="filter active" data-filter="all" type="button">全部</button>
            <button class="filter source-archive-filter" data-filter="active" type="button">活跃</button>
            <button class="filter source-archive-filter" data-filter="archived" type="button">已归档</button>
            <button id="refresh-button" class="icon-button" title="重新扫描" aria-label="重新扫描">↻</button>
          </div>
          <div class="display-controls">
            <span>全局字体</span>
            <div class="font-scale-control" role="group" aria-label="调整所有文本的字体大小">
              <button id="font-decrease" class="font-scale-button" type="button" aria-label="减小所有字体">−</button>
              <output id="font-scale-value" aria-live="polite">100%</output>
              <button id="font-increase" class="font-scale-button" type="button" aria-label="增大所有字体">+</button>
            </div>
          </div>
          <div class="compare-controls">
            <div class="compare-control-copy">
              <strong id="compare-control-title">System prompt 对比</strong>
              <span id="compare-selection-label">请选择两个 session</span>
            </div>
            <div class="compare-actions">
              <button id="compare-clear" class="compare-clear" type="button" disabled>清除</button>
              <button id="compare-button" class="compare-button" type="button" disabled>开始比较</button>
            </div>
          </div>
        </div>

        <div id="session-list" class="session-list" aria-live="polite"></div>

        <footer class="sidebar-footer">
          <span class="privacy-dot"></span>
          <span>只读 · 数据仅在本机 127.0.0.1 传输</span>
        </footer>
      </aside>

      <main class="workspace">
        <div id="empty-state" class="empty-state">
          <div class="empty-orbit" aria-hidden="true"><span></span></div>
          <h2 id="empty-title">选择一个 Codex session</h2>
          <p id="empty-description">查看 system prompt、每轮 query、thinking、tool call 与 tool result。</p>
        </div>

        <section id="compare-view" class="compare-view hidden" aria-live="polite">
          <header class="compare-header">
            <div>
              <div id="compare-eyebrow" class="eyebrow">SYSTEM PROMPT DIFF</div>
              <h2>Session 对比</h2>
              <p id="compare-description">绿色表示新增，红色表示删除；修改行会在两侧高亮具体变化片段。</p>
            </div>
            <button id="compare-close" class="compare-close" type="button">返回 session</button>
          </header>
          <div id="compare-session-summary" class="compare-session-summary"></div>
          <div id="compare-diff-summary" class="compare-diff-summary"></div>
          <div id="compare-diff" class="compare-diff"></div>
        </section>

        <div id="detail" class="detail hidden">
          <header class="detail-header">
            <div class="detail-title-wrap">
              <div class="eyebrow"><span id="session-state-dot" class="state-dot"></span><span id="session-state"></span></div>
              <h2 id="session-title"></h2>
              <p id="session-id" class="mono"></p>
            </div>
            <div id="session-stats" class="stats"></div>
          </header>

          <section id="metadata" class="metadata-strip"></section>

          <section class="system-section">
            <div class="section-heading">
              <div>
                <span class="section-index">00</span>
                <h3 id="system-heading">System prompt</h3>
              </div>
              <span id="system-count" class="count-pill"></span>
            </div>
            <div id="system-prompts" class="system-prompts"></div>
          </section>

          <section class="turns-section">
            <div id="turns"></div>
          </section>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
